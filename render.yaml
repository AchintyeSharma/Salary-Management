# Render Blueprint for ACME Salary Management (Single-Origin Docker + Managed PostgreSQL 16)
# Deploy via Render Dashboard -> Blueprints, then set secret env vars (HR_DEMO_PASSWORD, APP_ORIGIN).
# Run one-time setup via Render Shell after first deploy:
#   npm run db:migrate
#   npm run db:seed
#   npm run hr:provision

databases:
  - name: acme-salary-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: acme_salary
    user: acme_admin

services:
  - type: web
    name: acme-salary-management
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: PAY_INTERPRETER_MODE
        value: deterministic
      - key: APP_ORIGIN
        sync: false # Set to https://<your-service>.onrender.com
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
      - key: DATABASE_URL
        sync: false # Set to restricted acme_app role connection string (provisioned via migrations)
      - key: HR_DEMO_EMAIL
        value: hr.manager@acme.example
      - key: HR_DEMO_NAME
        value: ACME HR Manager
      - key: HR_DEMO_PASSWORD
        sync: false # Provision outside Git and share with evaluators separately
